app = 'ffis-scrubber'
primary_region = 'sjc'

[build]

[env]
  API_REQUEST_TIMEOUT = '30'
  STREAMLIT_LAYOUT = 'wide'
  STREAMLIT_PAGE_ICON = '🧹'
  STREAMLIT_PAGE_TITLE = 'Flat File Scrubber'
  STREAMLIT_SIDEBAR_STATE = 'expanded'
  UNDO_HISTORY_LIMIT = '20'
  # ── Email pipeline behavior (non-secret; credentials stay in Fly secrets) ──
  IMAP_HOST = 'imap.gmail.com'
  IMAP_PORT = '993'
  IMAP_USE_SSL = 'true'
  IMAP_FOLDER = 'INBOX'
  SMTP_HOST = 'smtp.gmail.com'
  SMTP_PORT = '587'
  FFIS_PIPELINE_ONLY_UNSEEN = 'true'
  FFIS_PIPELINE_MARK_SEEN = 'true'
  FFIS_PIPELINE_REPLY = 'true'
  FFIS_DEDUP_BACKEND = 'auto'
  FFIS_EXPORT_GOOD = 'false'
  FFIS_EXPORT_BACKEND = 'auto'
  FFIS_EXPORT_IF_EXISTS = 'append'

[processes]
  app = 'python -m streamlit run flat_file_scrubber.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false'
  ingest = 'python ffis_email_pipeline.py --watch --interval 120'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  memory = '2gb'
  cpus = 1
  memory_mb = 2048